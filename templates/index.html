<!DOCTYPE html>
<head>
            <title>Chatbot Demo</title>
            <link rel="stylesheet" href="chtbt.css">
</head>
<body>
<div class="chat-container">
        <div class="chat-header">
            <div class="chat-avatar">cc</div>
                <div>
                    <h2>Chatbot Demo</h2>
                    <p class="status">Online</p>
                </div>
        </div>

    <div class="chat-body">
        <div class="bot-message">
        Hello! I'm a demo chatbot. Type a message to see how I respond.
        </div>
            <div class="user-message">
        Hi there! This looks great.
            </div>
    </div>

        <div class="chat-input">
            <input type="text" placeholder="Type a message..." />
            <button>Send</button>
        </div>
</div>
<script src="chtbt.js"></script>
</body>
</html>
